version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fwident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fwident_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fwident}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fwident}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fwident}:${POSTGRES_PASSWORD:-fwident_dev}@postgres:5432/${POSTGRES_DB:-fwident}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fwident}:${POSTGRES_PASSWORD:-fwident_dev}@postgres:5432/${POSTGRES_DB:-fwident}
      PROVIDER: mock
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
